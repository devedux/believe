<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--bg-app);color:var(--fg-1);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.card{background:#fff;border-radius:12px;height:80px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
</style></head><body>
<div class="row">
  <div class="card" style="box-shadow:var(--shadow-xs)">xs</div>
  <div class="card" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="card" style="box-shadow:var(--shadow-md)">md</div>
  <div class="card" style="box-shadow:var(--shadow-lg)">lg</div>
  <div class="card" style="box-shadow:var(--shadow-xl)">xl</div>
  <div class="card" style="box-shadow:var(--shadow-brand);color:var(--cyan-700)">brand</div>
</div>
</body></html>
