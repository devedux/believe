<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Language colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-surface);padding:20px;color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .lang{border:1px solid var(--border-1);border-radius:var(--radius-md);padding:10px 12px;display:flex;align-items:center;gap:10px;border-top:3px solid var(--c)}
  .flag{font-size:22px;line-height:1}
  .name{font-size:13px;font-weight:700}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head><body>
<div class="grid">
  <div class="lang" style="--c:#0693E3"><span class="flag">🇬🇧</span><div><div class="name">Inglés</div><div class="hex">#0693E3</div></div></div>
  <div class="lang" style="--c:#025C9B"><span class="flag">🇫🇷</span><div><div class="name">Francés</div><div class="hex">#025C9B</div></div></div>
  <div class="lang" style="--c:#2A313B"><span class="flag">🇩🇪</span><div><div class="name">Alemán</div><div class="hex">#2A313B</div></div></div>
  <div class="lang" style="--c:#16A34A"><span class="flag">🇮🇹</span><div><div class="name">Italiano</div><div class="hex">#16A34A</div></div></div>
  <div class="lang" style="--c:#FCB900"><span class="flag">🇧🇷</span><div><div class="name">Portugués</div><div class="hex">#FCB900</div></div></div>
  <div class="lang" style="--c:#CF2E2E"><span class="flag">🇨🇳</span><div><div class="name">Mandarín</div><div class="hex">#CF2E2E</div></div></div>
  <div class="lang" style="--c:#971F1F"><span class="flag">🇯🇵</span><div><div class="name">Japonés</div><div class="hex">#971F1F</div></div></div>
  <div class="lang" style="--c:#FCB900"><span class="flag">🇪🇸</span><div><div class="name">Español</div><div class="hex">#FCB900</div></div></div>
</div>
</body></html>
