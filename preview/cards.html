<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg-app);color:var(--fg-1);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid var(--border-1);border-radius:12px;padding:18px}
.lang-card{border-top:3px solid var(--cyan-500);position:relative}
.flag{position:absolute;top:14px;right:14px;font-size:22px}
.meta{font-size:11px;font-weight:600;color:var(--cyan-700);letter-spacing:0.06em;text-transform:uppercase}
.title{font-size:20px;font-weight:700;margin:6px 0 4px}
.sub{font-size:13px;color:var(--fg-3)}
.class-row{display:flex;align-items:center;gap:14px}
.time{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:var(--indigo-500);font-variant-numeric:tabular-nums}
.room{font-size:12px;color:var(--fg-3)}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--cyan-50);color:var(--cyan-700);font-size:12px;font-weight:600}
</style></head><body>
<div class="grid">
  <div class="card lang-card"><span class="flag">🇬🇧</span>
    <div class="meta">INGLÉS · Nivel B2</div>
    <div class="title">Unit 6 · Reported speech</div>
    <div class="sub">Profesor: María José · 12 clases restantes</div>
  </div>
  <div class="card">
    <div class="meta" style="color:var(--amber-700)">CLASE DE HOY</div>
    <div class="class-row" style="margin-top:10px">
      <div class="time">16:00</div>
      <div><div style="font-weight:600">Aula 3 · María José</div><div class="room">Inglés · 1h · <span class="badge">Unit 6</span></div></div>
    </div>
  </div>
</div>
</body></html>
