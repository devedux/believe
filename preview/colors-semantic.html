<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-surface);padding:20px;color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tok{border:1px solid var(--border-1);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px}
  .dot{width:28px;height:28px;border-radius:999px}
  .name{font-size:12px;font-weight:700;letter-spacing:0.02em}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
  .use{font-size:11px;color:var(--fg-3)}
</style></head><body>
<div class="grid">
  <div class="tok"><div class="dot" style="background:#16A34A"></div><div class="name">Success</div><div class="hex">#16A34A</div><div class="use">Pago aprobado · asistencia ok</div></div>
  <div class="tok"><div class="dot" style="background:#FCB900"></div><div class="name">Warning</div><div class="hex">#FCB900</div><div class="use">Pago próximo a vencer</div></div>
  <div class="tok"><div class="dot" style="background:#CF2E2E"></div><div class="name">Danger</div><div class="hex">#CF2E2E</div><div class="use">Vencido · cancelar · eliminar</div></div>
  <div class="tok"><div class="dot" style="background:#0693E3"></div><div class="name">Info</div><div class="hex">#0693E3</div><div class="use">Aviso · tip · nuevo</div></div>
</div>
</body></html>
