<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;color:var(--fg-1);font-family:var(--font-sans)}
.row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px dashed var(--border-1)}
.tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);width:60px;flex-shrink:0}
.specimen{color:var(--fg-1)}</style></head><body>
<div class="row"><span class="tag">48 / 800</span><span class="specimen" style="font-size:48px;font-weight:800;letter-spacing:-0.02em;line-height:1.1">Creemos en lo que hacemos</span></div>
<div class="row"><span class="tag">36 / 700</span><span class="specimen" style="font-size:36px;font-weight:700;letter-spacing:-0.02em">Reservar mis clases</span></div>
<div class="row"><span class="tag">22 / 600</span><span class="specimen" style="font-size:22px;font-weight:600">Tu próxima clase</span></div>
<div class="row"><span class="tag">15 / 400</span><span class="specimen" style="font-size:15px;font-weight:400;line-height:1.6;color:var(--fg-2)">Viernes 14:00, Aula 3 con María José. Llega 5 minutos antes.</span></div>
<div class="row"><span class="tag">12 / 600</span><span class="specimen" style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-brand)">YO SOY BELIEVE</span></div>
</body></html>
