<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:#fff;color:var(--fg-1);font-family:var(--font-sans)}
.lead{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--cyan-500);font-weight:600;margin-bottom:8px}
.headline{font-size:56px;font-weight:800;letter-spacing:-0.025em;line-height:1.05;color:var(--indigo-500)}
.underline{position:relative;display:inline-block}
.underline::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:6px;background:var(--amber-500);border-radius:3px}
.sub{font-size:16px;color:var(--fg-3);margin-top:16px;max-width:580px;line-height:1.55}</style></head><body>
<div class="lead">Yo soy Believe</div>
<div class="headline">Creemos en <span class="underline">lo que hacemos</span></div>
<div class="sub">Manrope 800, -2.5% tracking, indigo anchor + yellow spark underline. Este es el treatment para héroes y portadas.</div>
</body></html>
