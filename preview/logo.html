<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:0;font-family:var(--font-sans);color:var(--fg-1)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0;height:170px}
.panel{display:flex;align-items:center;justify-content:center;padding:24px}
.light{background:#fff;border-right:1px solid var(--border-1)}
.dark{background:var(--indigo-500)}
img{width:auto;height:56px}
.dark img{filter:brightness(0) invert(1)}
</style></head><body>
<div class="row">
  <div class="panel light"><img src="../assets/logo-believe.svg" alt="Believe"></div>
  <div class="panel dark"><img src="../assets/logo-believe.svg" alt="Believe"></div>
</div>
</body></html>
