<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Neutral scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-surface);padding:20px;color:var(--fg-1)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-1)}
  .sw{flex:1;padding:14px 10px;height:90px;display:flex;flex-direction:column;justify-content:space-between}
  .sw .n{font-size:12px;font-weight:700}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:0.85}
  .cap{font-size:11px;color:var(--fg-3);margin-top:10px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#FFFFFF;color:#171C24;border-right:1px solid #EEF1F6"><div class="n">0</div><div class="h">#FFFFFF</div></div>
  <div class="sw" style="background:#F7F8FB;color:#171C24"><div class="n">50</div><div class="h">#F7F8FB</div></div>
  <div class="sw" style="background:#EEF1F6;color:#171C24"><div class="n">100</div><div class="h">#EEF1F6</div></div>
  <div class="sw" style="background:#DDE3EC;color:#171C24"><div class="n">200</div><div class="h">#DDE3EC</div></div>
  <div class="sw" style="background:#C2CAD6;color:#171C24"><div class="n">300</div><div class="h">#C2CAD6</div></div>
  <div class="sw" style="background:#8E97A6;color:white"><div class="n">400</div><div class="h">#8E97A6</div></div>
  <div class="sw" style="background:#656E7D;color:white"><div class="n">500</div><div class="h">#656E7D</div></div>
  <div class="sw" style="background:#434B58;color:white"><div class="n">600</div><div class="h">#434B58</div></div>
  <div class="sw" style="background:#2A313B;color:white"><div class="n">700</div><div class="h">#2A313B</div></div>
  <div class="sw" style="background:#0A0D13;color:white"><div class="n">900</div><div class="h">#0A0D13</div></div>
</div>
<div class="cap">Neutrals · cool slate w/ subtle indigo tint</div>
</body></html>
