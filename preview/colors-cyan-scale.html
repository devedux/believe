<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cyan scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-surface);padding:20px;color:var(--fg-1)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-1)}
  .sw{flex:1;padding:14px 10px;height:90px;display:flex;flex-direction:column;justify-content:space-between}
  .sw .n{font-size:12px;font-weight:700}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:0.85}
  .cap{font-size:11px;color:var(--fg-3);margin-top:10px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#E6F5FD;color:#01223B"><div class="n">50</div><div class="h">#E6F5FD</div></div>
  <div class="sw" style="background:#C3E7FA;color:#01223B"><div class="n">100</div><div class="h">#C3E7FA</div></div>
  <div class="sw" style="background:#8DD1F4;color:#01223B"><div class="n">200</div><div class="h">#8DD1F4</div></div>
  <div class="sw" style="background:#52B8EC;color:#01223B"><div class="n">300</div><div class="h">#52B8EC</div></div>
  <div class="sw" style="background:#1FA2E4;color:white"><div class="n">400</div><div class="h">#1FA2E4</div></div>
  <div class="sw" style="background:#0693E3;color:white"><div class="n">500</div><div class="h">#0693E3</div></div>
  <div class="sw" style="background:#0477BA;color:white"><div class="n">600</div><div class="h">#0477BA</div></div>
  <div class="sw" style="background:#025C9B;color:white"><div class="n">700</div><div class="h">#025C9B</div></div>
  <div class="sw" style="background:#023F6B;color:white"><div class="n">800</div><div class="h">#023F6B</div></div>
  <div class="sw" style="background:#01223B;color:white"><div class="n">900</div><div class="h">#01223B</div></div>
</div>
<div class="cap">Cyan scale · primary · 10 steps</div>
</body></html>
