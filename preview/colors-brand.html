<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-surface);padding:20px;color:var(--fg-1)}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:var(--radius-md);padding:14px;height:92px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-1)}
  .sw .name{font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
  .sw .hex{font-family:var(--font-mono);font-size:11px;opacity:0.9}
  .caption{font-size:11px;color:var(--fg-3);margin-top:10px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#0693E3;color:white"><div class="name">Cyan · primary</div><div class="hex">#0693E3</div></div>
  <div class="sw" style="background:#020381;color:white"><div class="name">Indigo · anchor</div><div class="hex">#020381</div></div>
  <div class="sw" style="background:#025C9B;color:white"><div class="name">Blue · bridge</div><div class="hex">#025C9B</div></div>
  <div class="sw" style="background:#FCB900;color:#0A0D13"><div class="name">Yellow · spark</div><div class="hex">#FCB900</div></div>
  <div class="sw" style="background:#CF2E2E;color:white"><div class="name">Red · alert</div><div class="hex">#CF2E2E</div></div>
</div>
<div class="caption">Los cinco colores oficiales de Believe · cyan & indigo = primarios</div>
</body></html>
