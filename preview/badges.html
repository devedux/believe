<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Badges & chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;color:var(--fg-1);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.lbl{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;width:90px;flex-shrink:0}
.b{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:0.02em}
.b .dot{width:6px;height:6px;border-radius:50%}
</style></head><body>
<div class="row"><span class="lbl">Status</span>
  <span class="b" style="background:#E6F5E9;color:#16A34A"><span class="dot" style="background:#16A34A"></span>Aprobado</span>
  <span class="b" style="background:#FFF7E0;color:#8A6300"><span class="dot" style="background:#FCB900"></span>Pendiente</span>
  <span class="b" style="background:#FBE7E7;color:#971F1F"><span class="dot" style="background:#CF2E2E"></span>Vencido</span>
  <span class="b" style="background:#E6F5FD;color:#025C9B"><span class="dot" style="background:#0693E3"></span>En revisión</span>
</div>
<div class="row"><span class="lbl">Language</span>
  <span class="b" style="background:#E6F5FD;color:#025C9B">🇬🇧 Inglés</span>
  <span class="b" style="background:#E6E6F5;color:#020381">🇫🇷 Francés</span>
  <span class="b" style="background:#FFF7E0;color:#8A6300">🇧🇷 Portugués</span>
  <span class="b" style="background:#FBE7E7;color:#971F1F">🇨🇳 Mandarín</span>
</div>
<div class="row"><span class="lbl">Role</span>
  <span class="b" style="background:var(--indigo-500);color:white">Estudiante</span>
  <span class="b" style="background:var(--cyan-500);color:white">Profesor</span>
  <span class="b" style="background:var(--amber-500);color:#0A0D13">Recepción</span>
  <span class="b" style="background:var(--neutral-900);color:white">Dueño</span>
</div>
</body></html>
